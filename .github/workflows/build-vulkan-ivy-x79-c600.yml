name: Build Vulkan X79/C600 Ivy Bridge

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: Optional commit hash/ref to build from
        required: false
        default: ""

concurrency:
  group: x79-vulkan-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_VERSION: 1.4.357.0

jobs:
  windows-vulkan-ivy:
    runs-on: windows-2025

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.ref_name }}

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe `
            -o "$env:RUNNER_TEMP/VulkanSDK-Installer.exe" `
            -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"

          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" `
            --accept-licenses `
            --default-answer `
            --confirm-command `
            install

          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y

      - name: Show compiler
        shell: pwsh
        run: |
          clang --version
          clang++ --version
          cmake --version
          ninja --version

      - name: Configure X79/C600 Vulkan Ivy
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" `
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake `
            -D CMAKE_BUILD_TYPE=Release `
            -D CMAKE_C_FLAGS="-march=ivybridge -mtune=ivybridge" `
            -D CMAKE_CXX_FLAGS="-march=ivybridge -mtune=ivybridge" `
            -D GGML_NATIVE=OFF `
            -D GGML_CPU_ALL_VARIANTS=OFF `
            -D GGML_CPU=ON `
            -D GGML_SSE42=ON `
            -D GGML_AVX=ON `
            -D GGML_F16C=ON `
            -D GGML_AVX2=OFF `
            -D GGML_BMI2=OFF `
            -D GGML_FMA=OFF `
            -D GGML_AVX512=OFF `
            -D GGML_AVX512_VBMI=OFF `
            -D GGML_AVX512_VNNI=OFF `
            -D GGML_AVX512_BF16=OFF `
            -D GGML_VULKAN=ON `
            -D GGML_BACKEND_DL=ON `
            -D GGML_LTO=OFF `
            -D GGML_CCACHE=ON `
            -D GGML_RPC=ON `
            -D LLAMA_BUILD_SERVER=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Show build outputs
        shell: pwsh
        run: |
          Write-Host "=== Release binaries ==="
          Get-ChildItem build/bin/Release -File -ErrorAction SilentlyContinue |
            Select-Object Name, Length

          Write-Host "=== Backend binaries ==="
          Get-ChildItem build/bin/Release -Filter "ggml*.dll" -File -ErrorAction SilentlyContinue |
            Select-Object Name, Length

      - name: Verify Vulkan backend
        shell: pwsh
        run: |
          $required = @(
            "llama-cli.exe",
            "llama-server.exe"
          )

          foreach ($file in $required) {
            $path = Join-Path "build/bin/Release" $file

            if (!(Test-Path $path)) {
              throw "Missing required binary: $file"
            }

            Write-Host "$file OK"
          }

          $vulkan = Get-ChildItem `
            "build/bin/Release" `
            -Filter "*vulkan*.dll" `
            -File `
            -ErrorAction SilentlyContinue

          if ($null -eq $vulkan -or $vulkan.Count -eq 0) {
            throw "No Vulkan backend DLL found."
          }

          $vulkan | Select-Object Name, Length

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            "build/bin/Release/llama-cli.exe" `
            "dist/"

          Copy-Item `
            "build/bin/Release/llama-server.exe" `
            "dist/"

          Get-ChildItem `
            "build/bin/Release" `
            -Filter "*.dll" `
            -File `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item $_.FullName "dist/"
            }

          Compress-Archive `
            -Path "dist/*" `
            -DestinationPath "x79-c600-vulkan-ivy-windows-x64.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: x79-c600-vulkan-ivy
          path: x79-c600-vulkan-ivy-windows-x64.zip
